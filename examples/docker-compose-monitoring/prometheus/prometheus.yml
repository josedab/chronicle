global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "chronicle"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["chronicle:8086"]
        labels:
          service: "chronicle"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

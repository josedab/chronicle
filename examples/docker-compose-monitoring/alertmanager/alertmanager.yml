global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 2h
  receiver: "webhook-default"

receivers:
  - name: "webhook-default"
    webhook_configs:
      - url: "http://127.0.0.1:5001/webhook"
        send_resolved: true
